apiVersion: v1
kind: Secret
metadata:
  name: {{ include "metadata.fullname" . }}-credentials
  labels:
    {{- include "metadata.labels" . | nindent 4 }}
type: Opaque
stringData:
  pg-user: {{ .Values.postgres.username | quote }}
  pg-password: {{ .Values.postgres.password | quote }}
  pgadmin-email: {{ .Values.pgadmin.email | quote }}
  pgadmin-password: {{ .Values.pgadmin.password | quote }}
  servers.json: |-
    {
      "Servers": {
        "1": {
          "Name": "{{ include "metadata.fullname" . }} PostgreSQL",
          "Group": "Servers",
          "Host": "{{ include "metadata.postgresService" . }}",
          "Port": {{ .Values.postgres.port }},
          "MaintenanceDB": {{ .Values.postgres.database | quote }},
          "Username": {{ .Values.postgres.username | quote }},
          "SSLMode": "prefer",
          "PassFile": "/pgadmin4/pgpass"
        }
      }
    }
  pgpass: {{ printf "%s:%v:%s:%s:%s" (include "metadata.postgresService" .) .Values.postgres.port .Values.postgres.database .Values.postgres.username .Values.postgres.password | quote }}
