apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "metadata.fullname" . }}-postgres-data
  labels:
    {{- include "metadata.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.postgres.storage.accessMode }}
  storageClassName: {{ .Values.postgres.storage.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.postgres.storage.size }}
