
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "metadata.fullname" . }}-pgadmin
  labels:
    {{- include "metadata.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgadmin
spec:
  replicas: {{ .Values.pgadmin.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: pgadmin
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: pgadmin
      annotations:
        checksum/credentials: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      initContainers:
        - name: setup-pgpass
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              cp /tmp/secret/pgpass /var/lib/pgadmin-pgpass/pgpass
              chmod 0600 /var/lib/pgadmin-pgpass/pgpass
              chown 5050:5050 /var/lib/pgadmin-pgpass/pgpass
          volumeMounts:
            - name: raw-credentials
              mountPath: /tmp/secret/pgpass
              subPath: pgpass
              readOnly: true
            - name: pgpass-volume
              mountPath: /var/lib/pgadmin-pgpass

      containers:
        - name: pgadmin
          image: {{ .Values.pgadmin.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "metadata.fullname" . }}-credentials
                  key: pgadmin-email
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "metadata.fullname" . }}-credentials
                  key: pgadmin-password
            - name: PGADMIN_SERVER_JSON_FILE
              value: /pgadmin4/servers.json
            - name: PGADMIN_REPLACE_SERVERS_ON_STARTUP
              value: "True"
          readinessProbe:
            httpGet:
              path: /misc/ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /misc/ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.pgadmin.resources | nindent 12 }}
          volumeMounts:
            - name: pgadmin-config
              mountPath: /pgadmin4/config_local.py
              subPath: config_local.py
              readOnly: true
            - name: servers-json-volume
              mountPath: /pgadmin4/servers.json
              subPath: servers.json
              readOnly: true
            - name: pgpass-volume
              mountPath: /pgadmin4/pgpass
              subPath: pgpass
              readOnly: true

      volumes:
        - name: pgadmin-config
          configMap:
            name: {{ include "metadata.fullname" . }}-pgadmin-config

        - name: servers-json-volume
          secret:
            secretName: {{ include "metadata.fullname" . }}-credentials
            defaultMode: 420
            items:
              - key: servers.json
                path: servers.json

        - name: raw-credentials
          secret:
            secretName: {{ include "metadata.fullname" . }}-credentials
            items:
              - key: pgpass
                path: pgpass

        - name: pgpass-volume
          emptyDir: {}

