apiVersion: v1
kind: Service
metadata:
  name: {{ include "metadata.postgresService" . }}
  labels:
    {{- include "metadata.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: postgres
