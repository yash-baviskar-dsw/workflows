<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnifyAI CI/CD Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 50px auto;
            padding: 0 20px;
            background: #f5f5f5;
        }

        h1 {
            margin-bottom: 30px;
        }

        .services {
            display: flex;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            flex: 1;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .status {
            font-weight: bold;
            margin-bottom: 15px;
        }

        .healthy {
            color: green;
        }

        .error {
            color: red;
        }

        pre {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            margin-bottom: 25px;
        }
    </style>
</head>

<body>

    <h1>UnifyAI CI/CD Demo</h1>

    <button onclick="loadServices()">Refresh</button>

    <div class="services">

        <div class="card">
            <h2>Service 1</h2>
            <div id="service1-status">Loading...</div>
            <pre id="service1-data"></pre>
        </div>

        <div class="card">
            <h2>Service 2</h2>
            <div id="service2-status">Loading...</div>
            <pre id="service2-data"></pre>
        </div>

    </div>

    <script>
        async function loadService(name) {
            const statusElement = document.getElementById(`${name}-status`);
            const dataElement = document.getElementById(`${name}-data`);

            try {
                const response = await fetch(`/api/${name}`);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();

                statusElement.textContent = "Healthy";
                statusElement.className = "status healthy";

                dataElement.textContent =
                    JSON.stringify(data, null, 2);

            } catch (error) {
                statusElement.textContent = "Unavailable";
                statusElement.className = "status error";

                dataElement.textContent = error.message;
            }
        }

        function loadServices() {
            loadService("service1");
            loadService("service2");
        }

        loadServices();
    </script>

</body>
</html>
